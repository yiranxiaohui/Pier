name: pi update

# Pier compiles the pi SDK into its Host sidecar at one pinned version
# (packages/host/package.json). This checks npm for a newer pi every day and opens a pull
# request that pins it, with pi's changelog and breaking changes in the description. Merging
# it and cutting a patch release delivers the new pi through the in-app updater.
#
# Pull requests opened with the default GITHUB_TOKEN do not trigger other workflows, so the
# job starts CI on the branch itself (workflow_dispatch); its checks show up on the pull
# request. Set the optional PI_UPDATE_TOKEN secret (a fine-grained token with contents and
# pull-request write access) to open the pull request as that user instead, which runs the
# regular pull_request CI. With the default token, "Allow GitHub Actions to create and approve
# pull requests" must be enabled in the repository's Actions settings.

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "pi version to pin (default: npm latest)"
        required: false

permissions:
  contents: read

concurrency:
  group: pi-update
  cancel-in-progress: false

jobs:
  update:
    name: check npm and open a pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.PI_UPDATE_TOKEN || github.token }}
      CUSTOM_TOKEN: ${{ secrets.PI_UPDATE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.PI_UPDATE_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Dependencies are installed with Bun (setup-bun), so there is no npm cache to restore.
          package-manager-cache: false

      # Bun installs the workspace from bun.lock; packageManager in package.json pins its version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Compare with npm
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: node packages/host/scripts/pi-update.mjs check --version "${VERSION}"

      - name: Look for an existing pull request
        id: existing
        if: steps.check.outputs.update == 'true'
        env:
          BRANCH: deps/pi-${{ steps.check.outputs.target }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Branch $BRANCH already exists; nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin the new version
        id: pin
        if: steps.check.outputs.update == 'true' && steps.existing.outputs.exists == 'false'
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          TARGET: ${{ steps.check.outputs.target }}
        run: |
          node packages/host/scripts/pi-update.mjs apply --version "$TARGET"
          bun install
          node packages/host/scripts/pi-update.mjs notes --from "$CURRENT" --to "$TARGET" --out "$RUNNER_TEMP/pr-body.md"
          git diff --stat

      # A quick signal in this run; the full CI runs on the pushed branch.
      - name: Typecheck
        id: typecheck
        if: steps.pin.outcome == 'success'
        continue-on-error: true
        run: bun run typecheck

      - name: Open the pull request
        if: steps.pin.outcome == 'success'
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          TARGET: ${{ steps.check.outputs.target }}
          BRANCH: deps/pi-${{ steps.check.outputs.target }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add packages/host/package.json bun.lock
          git commit -m "chore(deps): update pi to ${TARGET}" \
            -m "Pin @earendil-works/pi-coding-agent and @earendil-works/pi-ai to ${TARGET} (from ${CURRENT}) and refresh bun.lock."
          git push origin "$BRANCH"

          body="$RUNNER_TEMP/pr-body.md"
          if [ "$TYPECHECK" != "success" ]; then
            printf '> [!WARNING]\n> `bun run typecheck` failed after the update: Pier needs code changes for this pi version before it can merge.\n\n' \
              | cat - "$body" > "$body.new" && mv "$body.new" "$body"
          fi
          url=$(gh pr create --base main --head "$BRANCH" --title "chore(deps): update pi to ${TARGET}" --body-file "$body")
          echo "Opened $url"

          # Close older pi update pull requests that this one supersedes.
          gh pr list --state open --base main --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("deps/pi-")) | select(.headRefName != env.BRANCH) | .number' \
            | while read -r number; do
                gh pr close "$number" --delete-branch --comment "Superseded by $url."
              done

          # Pull requests opened with GITHUB_TOKEN do not trigger pull_request workflows.
          if [ "$CUSTOM_TOKEN" != "true" ]; then
            gh workflow run ci.yml --ref "$BRANCH"
          fi

      - name: Summary
        if: always()
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          TARGET: ${{ steps.check.outputs.target }}
          UPDATE: ${{ steps.check.outputs.update }}
          EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          {
            echo "### pi update"
            echo
            echo "Pinned: \`${CURRENT:-?}\` · npm: \`${TARGET:-?}\`"
            if [ "$UPDATE" != "true" ]; then echo; echo "Up to date."
            elif [ "$EXISTS" = "true" ]; then echo; echo "Pull request branch \`deps/pi-${TARGET}\` already exists."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
