name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by the pi update workflow on its branches (see pi-update.yml).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Dependencies are installed with Bun (setup-bun), so there is no npm cache to restore.
          package-manager-cache: false

      # Bun installs the workspace from bun.lock; packageManager in package.json pins its version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  sidecar:
    name: sidecar build (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [bun-linux-x64, bun-darwin-arm64, bun-windows-x64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Dependencies are installed with Bun (setup-bun), so there is no npm cache to restore.
          package-manager-cache: false

      # Bun installs the workspace from bun.lock; packageManager in package.json pins its version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build sidecar
        run: bun run build:sidecar --target ${{ matrix.target }}

      - name: Smoke test (native target only)
        if: matrix.target == 'bun-linux-x64'
        run: |
          node packages/host/scripts/smoke-sidecar.mjs packages/host/bin/pier-host
          node packages/host/scripts/smoke-mcp.mjs packages/host/bin/pier-host

  desktop:
    name: desktop shell (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Dependencies are installed with Bun (setup-bun), so there is no npm cache to restore.
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Bun installs the workspace from bun.lock; packageManager in package.json pins its version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tauri-build requires the externalBin and resources to exist.
      - name: Prepare sidecar
        run: bun run --filter @pier/desktop sidecar

      - name: Build web UI
        run: bun run --filter @pier/desktop build:web

      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  mobile:
    name: mobile bundle (${{ matrix.platform }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Dependencies are installed with Bun (setup-bun), so there is no npm cache to restore.
          package-manager-cache: false

      # Bun installs the workspace from bun.lock; packageManager in package.json pins its version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Expo SDK dependency versions
        working-directory: apps/mobile
        run: bunx expo install --check

      # Metro bundle + Hermes bytecode: catches resolution and syntax problems in the
      # shared workspace packages without building the native app.
      - name: Export JS bundle
        working-directory: apps/mobile
        run: bunx expo export --platform ${{ matrix.platform }} --output-dir dist/${{ matrix.platform }}

      # The release APK depends on plugins/withAndroidRelease.js patching the generated Gradle
      # project; prebuild fails here if an Expo upgrade changes the template it expects.
      - name: Prebuild Android project
        if: matrix.platform == 'android'
        working-directory: apps/mobile
        run: |
          bunx expo prebuild --platform android --no-install
          grep -q "pier: release signing" android/app/build.gradle

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and lint Android update notifications
        if: matrix.platform == 'android'
        working-directory: apps/mobile/android
        # K2 lint crashes while analyzing react-native-worklets' Kotlin Gradle script with AGP 8.12.
        run: ./gradlew :pier-update-notification:compileDebugKotlin :pier-update-notification:lintDebug -PreactNativeArchitectures=arm64-v8a -Pandroid.lint.useK2Uast=false
