name: Release

on:
  push:
    tags: ["v*"]
  # Dry run from a branch: builds and smoke-tests every asset but does not publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag · lint · typecheck · test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Dependencies are installed with Bun (setup-bun), so there is no npm cache to restore.
          package-manager-cache: false

      # Bun installs the workspace from bun.lock; packageManager in package.json pins its version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Check tag, version, and branch
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "Dry run on ${GITHUB_REF_NAME}: skipping tag checks"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  desktop:
    name: desktop ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # 22.04 keeps the glibc / WebKitGTK baseline low for the Linux packages.
          - { platform: linux-x64, runner: ubuntu-22.04, bundles: "deb,appimage" }
          # `app` produces the signed updater archive (.app.tar.gz) next to the dmg.
          - { platform: darwin-arm64, runner: macos-latest, bundles: "app,dmg" }
          - { platform: darwin-x64, runner: macos-15-intel, bundles: "app,dmg" }
          - { platform: windows-x64, runner: windows-latest, bundles: nsis }
    env:
      NAME: pier-desktop-${{ github.ref_name }}-${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Dependencies are installed with Bun (setup-bun), so there is no npm cache to restore.
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      # Bun installs the workspace from bun.lock; packageManager in package.json pins its version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # beforeBuildCommand builds the sidecar for this runner and the web UI.
      # The updater key signs the update bundles (createUpdaterArtifacts in tauri.conf.json);
      # its public half is plugins.updater.pubkey.
      - name: Build bundles
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is required to sign update bundles"
            exit 1
          fi
          bun run tauri build --bundles ${{ matrix.bundles }}

      # The app is ad-hoc signed (bundle.macOS.signingIdentity "-"), not notarized: Gatekeeper
      # then offers "Open Anyway" instead of reporting the download as damaged. Check that the
      # signature covers the sidecar and that the hardened runtime still lets Bun's JIT run.
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d apps/desktop/src-tauri/target/release/bundle/macos/*.app | head -1)
          [ -d "$app" ] || { echo "::error::No .app bundle produced"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          for exe in "$app/Contents/MacOS/"*; do
            info=$(codesign -dvvv "$exe" 2>&1)
            echo "$info" | grep -E '^(Executable|Identifier|Signature|CodeDirectory)'
            echo "$info" | grep -q '^Signature=adhoc' || { echo "::error::$exe is not ad-hoc signed"; exit 1; }
          done
          # Pier.app ships pi's assets as a resource; the desktop passes them through PI_PACKAGE_DIR.
          PI_PACKAGE_DIR="$app/Contents/Resources/pi-assets" \
            node packages/host/scripts/smoke-sidecar.mjs "$app/Contents/MacOS/pier-host" "${{ needs.verify.outputs.version }}"
          PI_PACKAGE_DIR="$app/Contents/Resources/pi-assets" \
            node packages/host/scripts/smoke-mcp.mjs "$app/Contents/MacOS/pier-host"

      # The bundles ship the sidecar that beforeBuildCommand prepared; smoke-test that exact binary
      # (macOS tests it inside the signed .app above).
      - name: Smoke test the bundled sidecar
        if: runner.os != 'macOS'
        run: |
          tauri=apps/desktop/src-tauri
          exe=$(ls "$tauri"/binaries/pier-host-* | head -1)
          [ -f "$exe" ] || { echo "::error::No sidecar in $tauri/binaries"; exit 1; }
          PI_PACKAGE_DIR="$tauri/pi-assets" \
            node packages/host/scripts/smoke-sidecar.mjs "$exe" "${{ needs.verify.outputs.version }}"
          PI_PACKAGE_DIR="$tauri/pi-assets" \
            node packages/host/scripts/smoke-mcp.mjs "$exe"

      - name: Collect bundles
        run: |
          mkdir -p dist
          bundle=apps/desktop/src-tauri/target/release/bundle
          shopt -s nullglob
          # Installers, plus the updater bundles and their signatures (<bundle>.sig).
          # collect <bundle suffix> <asset suffix> <files…>: keeps a trailing ".sig".
          collect() {
            local from=$1 to=$2 file
            shift 2
            for file in "$@"; do cp "$file" "dist/${NAME}.${to}${file##*"$from"}"; done
          }
          collect .deb deb "$bundle"/deb/*.deb "$bundle"/deb/*.deb.sig
          collect .AppImage AppImage "$bundle"/appimage/*.AppImage "$bundle"/appimage/*.AppImage.sig
          collect .dmg dmg "$bundle"/dmg/*.dmg
          collect .app.tar.gz app.tar.gz "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig
          collect -setup.exe setup.exe "$bundle"/nsis/*-setup.exe "$bundle"/nsis/*-setup.exe.sig
          ls -la dist
          [ -n "$(ls dist)" ] || { echo "::error::No bundles produced"; exit 1; }
          # Every platform must ship a signed update bundle.
          ls dist/*.sig >/dev/null 2>&1 || { echo "::error::No updater signatures produced"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.NAME }}
          path: dist/*
          if-no-files-found: error

  host:
    name: headless host linux-${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build Host and CLI archive
        run: node packages/host/scripts/build-host-release.mjs --arch ${{ matrix.arch }}
      - name: Smoke test without a desktop
        run: |
          mkdir unpacked
          tar -xzf dist/pier-host-*.tar.gz -C unpacked
          env -u DISPLAY -u WAYLAND_DISPLAY -u PI_PACKAGE_DIR node packages/host/scripts/smoke-sidecar.mjs unpacked/pier-host "${{ needs.verify.outputs.version }}"
          env -u DISPLAY -u WAYLAND_DISPLAY -u PI_PACKAGE_DIR node packages/host/scripts/smoke-mcp.mjs unpacked/pier-host
          unpacked/pier-cli --help
          bash -n scripts/install-host.sh scripts/host-manager.sh
          mkdir single-file
          cp dist/pier-host-v*-linux-${{ matrix.arch }} single-file/pier-host
          env -u DISPLAY -u WAYLAND_DISPLAY -u PI_PACKAGE_DIR node packages/host/scripts/smoke-sidecar.mjs single-file/pier-host "${{ needs.verify.outputs.version }}" --standalone
          env -u DISPLAY -u WAYLAND_DISPLAY -u PI_PACKAGE_DIR node packages/host/scripts/smoke-mcp.mjs single-file/pier-host
          single-file/pier-host cli --help
          node packages/host/scripts/smoke-standalone.mjs single-file/pier-host "${{ needs.verify.outputs.version }}"
      - uses: actions/upload-artifact@v5
        with:
          name: pier-host-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: dist/pier-host-*
          if-no-files-found: error

  android:
    name: mobile android
    needs: verify
    runs-on: ubuntu-latest
    env:
      NAME: pier-mobile-${{ github.ref_name }}-android
      # SHA-256 of the Pier Android release certificate (key alias "pier"). Every APK must be signed
      # with this key, otherwise installed apps cannot be upgraded in place.
      ANDROID_CERT_SHA256: 0078f44ada161b2fa44b5bdfb97182aace34c9ec9d4e57362d9a62c168c2981d
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Dependencies are installed with Bun (setup-bun), so there is no npm cache to restore.
          package-manager-cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Bun installs the workspace from bun.lock; packageManager in package.json pins its version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::The ANDROID_RELEASE_KEYSTORE and ANDROID_RELEASE_KEYSTORE_PASSWORD secrets are required to sign the APK"
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/pier-release.jks"

      # android/ is generated from app.json; plugins/withAndroidRelease.js wires up release signing.
      - name: Prebuild
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_pierUploadStoreFile: ${{ runner.temp }}/pier-release.jks
          ORG_GRADLE_PROJECT_pierUploadStorePassword: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_pierUploadKeyAlias: pier
          ORG_GRADLE_PROJECT_pierUploadKeyPassword: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        # Real devices (64- and 32-bit ARM) and x86_64 emulators; 32-bit x86 is left out.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Verify signature
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if ! echo "$certs" | grep -qi "certificate SHA-256 digest: ${ANDROID_CERT_SHA256}$"; then
            echo "::error::The APK is not signed with the Pier release key"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/${NAME}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pier-release.jks"

  # latest.json for the desktop in-app updater and latest-android.json for the Android app
  # (also built on dry runs to validate the signatures).
  updater-manifest:
    name: updater manifest
    needs: [verify, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@v5
        with:
          path: desktop
          pattern: pier-desktop-*
          merge-multiple: true

      - uses: actions/download-artifact@v5
        with:
          path: android
          pattern: pier-mobile-*
          merge-multiple: true

      - name: Build latest.json and latest-android.json
        run: |
          version="${{ needs.verify.outputs.version }}"
          awk -v heading="## v${version}" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "::error::No CHANGELOG.md section for v${version}"
              exit 1
            fi
            echo "Dry run of ${GITHUB_REF_NAME}" > notes.md
          fi
          mkdir -p manifest
          node apps/desktop/scripts/updater-manifest.mjs \
            --assets desktop --version "${version}" --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --notes notes.md --out manifest/latest.json
          cat manifest/latest.json
          node apps/mobile/scripts/android-update-manifest.mjs \
            --apk "android/pier-mobile-${GITHUB_REF_NAME}-android.apk" --version "${version}" --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --notes notes.md --out manifest/latest-android.json
          cat manifest/latest-android.json

      - uses: actions/upload-artifact@v5
        with:
          name: updater-manifest
          path: manifest/*.json
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: [verify, desktop, host, android, updater-manifest]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/pier-release-assets
          merge-multiple: true

      - name: Checksums and release notes
        env:
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/pier-release-assets
        run: |
          (
            cd "$RELEASE_ASSETS_DIR"
            sha256sum * > SHA256SUMS.txt
          )
          cat "$RELEASE_ASSETS_DIR/SHA256SUMS.txt"
          # The CHANGELOG section for this version becomes the release notes.
          awk -v heading="## ${GITHUB_REF_NAME}" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md section for ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/pier-release-assets
        run: |
          version="${{ needs.verify.outputs.version }}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" "$RELEASE_ASSETS_DIR/"* \
            --title "Pier ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag $prerelease
